[project]
name = "myuniguide-v2"
version = "0.1.0"
description = "RAG over German university examination regulations"
requires-python = ">=3.12"
dependencies = [
    "docling>=2.0.0",
    "llama-index-core>=0.12.0",
    "llama-index-embeddings-google-genai>=0.2.0",
    "llama-index-llms-google-genai>=0.2.0",
    "llama-index-vector-stores-qdrant>=0.4.0",
    "qdrant-client>=1.12.0",
    "google-genai>=1.0.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "fastembed>=0.8.0",
    "llama-index-postprocessor-flag-embedding-reranker>=0.6.0",
    "flagembedding>=1.4.2",
    "langgraph>=1.2.11",
    "langfuse>=4.15.4",
    "fastapi>=0.141.1",
    "uvicorn>=0.53.0",
]

[dependency-groups]
dev = ["pytest>=8.0.0", "ruff>=0.8.0", "httpx>=0.27.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/myuniguide"]

[tool.ruff]
line-length = 100
