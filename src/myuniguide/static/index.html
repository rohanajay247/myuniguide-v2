<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MyUniGuide V2</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0b1420;
        --panel: #111d2c;
        --panel-2: #16263a;
        --line: #1f3549;
        --line-bright: #2b475f;
        --ink: #e8eef5;
        --dim: #7f95ab;
        --dimmer: #55697d;
        --accent: #6fb3d9;
        --green: #5fbf8f;
        --amber: #d9a441;
        --red: #e0705f;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        background: var(--bg);
      }
      body {
        margin: 0;
        padding: 3rem 1.25rem 5rem;
        font:
          300 16px/1.65 "IBM Plex Sans",
          -apple-system,
          system-ui,
          sans-serif;
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
      }
      main {
        max-width: 820px;
        margin: 0 auto;
      }
      .mono {
        font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace;
        font-size: 0.72rem;
        letter-spacing: 0.04em;
      }

      header {
        margin-bottom: 2.5rem;
      }
      .eyebrow {
        color: var(--accent);
        text-transform: uppercase;
        letter-spacing: 0.22em;
        margin-bottom: 0.9rem;
      }
      h1 {
        font-size: clamp(2rem, 5vw, 2.9rem);
        font-weight: 300;
        margin: 0 0 0.5rem;
        letter-spacing: -0.02em;
        line-height: 1.1;
      }
      h1 b {
        font-weight: 600;
      }
      .sub {
        color: var(--dim);
        font-size: 0.95rem;
        max-width: 56ch;
        margin: 0 0 1.5rem;
      }

      .notice b {
        color: var(--amber);
        font-weight: 500;
      }

      form {
        display: flex;
        gap: 0.6rem;
        margin-bottom: 0.9rem;
      }
      input[type="text"] {
        flex: 1;
        padding: 0.85rem 1rem;
        font:
          400 1rem "IBM Plex Sans",
          sans-serif;
        color: var(--ink);
        background: var(--panel);
        border: 1px solid var(--line-bright);
        border-radius: 2px;
      }
      input::placeholder {
        color: var(--dimmer);
      }
      /* blinking caret trailing the typed placeholder */
      input.typing::placeholder {
        color: var(--dimmer);
      }
      .field {
        position: relative;
        flex: 1;
        display: flex;
      }
      .field input {
        width: 100%;
      }
      .caret {
        position: absolute;
        right: 1rem;
        top: 50%;
        transform: translateY(-50%);
        width: 1px;
        height: 1.1em;
        background: var(--accent);
        animation: blink 1.1s step-end infinite;
        pointer-events: none;
      }
      @keyframes blink {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0;
        }
      }
      input:focus {
        outline: none;
        border-color: var(--accent);
        background: var(--panel-2);
      }
      button {
        padding: 0.85rem 1.6rem;
        font:
          500 0.9rem "IBM Plex Mono",
          monospace;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        background: var(--accent);
        color: var(--bg);
        border: 0;
        border-radius: 2px;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.4;
        cursor: default;
      }

      .examples {
        font-size: 0.82rem;
        color: var(--dimmer);
        margin-bottom: 2.5rem;
      }
      .examples button {
        background: none;
        color: var(--dim);
        border: 1px solid var(--line);
        padding: 0.25rem 0.6rem;
        margin: 0.2rem 0.3rem 0.2rem 0;
        font:
          400 0.78rem "IBM Plex Sans",
          sans-serif;
        letter-spacing: 0;
        text-transform: none;
        border-radius: 2px;
      }
      .examples button:hover {
        border-color: var(--accent);
        color: var(--accent);
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 2px;
        padding: 1.4rem 1.5rem;
        margin-bottom: 1.25rem;
      }
      .verdict {
        display: flex;
        align-items: center;
        gap: 0.8rem;
        flex-wrap: wrap;
        margin-bottom: 1rem;
        padding-bottom: 0.9rem;
        border-bottom: 1px solid var(--line);
      }
      .tag {
        font-family: "IBM Plex Mono", monospace;
        font-size: 0.7rem;
        letter-spacing: 0.16em;
        padding: 0.3rem 0.7rem;
        border-radius: 2px;
      }
      .ANSWER {
        background: rgba(95, 191, 143, 0.12);
        color: var(--green);
        border: 1px solid rgba(95, 191, 143, 0.3);
      }
      .DECLINE {
        background: rgba(127, 149, 171, 0.1);
        color: var(--dim);
        border: 1px solid var(--line-bright);
      }
      .CONFLICT {
        background: rgba(224, 112, 95, 0.12);
        color: var(--red);
        border: 1px solid rgba(224, 112, 95, 0.3);
      }
      .route {
        color: var(--dimmer);
      }
      .route span {
        color: var(--accent);
      }
      .answer-text {
        white-space: pre-wrap;
        font-size: 1rem;
        line-height: 1.7;
      }

      h2 {
        font-family: "IBM Plex Mono", monospace;
        font-size: 0.7rem;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.2em;
        color: var(--dimmer);
        margin: 2rem 0 0.8rem;
        display: flex;
        align-items: center;
        gap: 0.8rem;
      }
      h2::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--line);
      }

      .src {
        border-left: 2px solid var(--line);
        padding: 0.4rem 0 0.4rem 1rem;
        margin-bottom: 1rem;
      }
      .src.cited {
        border-left-color: var(--accent);
      }
      .src .cite {
        font-weight: 500;
        font-size: 0.9rem;
        color: var(--ink);
      }
      .src .meta {
        color: var(--dimmer);
        margin-left: 0.6rem;
      }
      .src p {
        margin: 0.35rem 0 0;
        color: var(--dim);
        font-size: 0.85rem;
      }
      .src blockquote {
        margin: 0.4rem 0 0;
        padding-left: 0.9rem;
        border-left: 1px solid var(--line-bright);
        color: var(--dim);
        font-size: 0.87rem;
        font-style: italic;
      }

      .conflict-box {
        background: rgba(224, 112, 95, 0.06);
        border: 1px solid rgba(224, 112, 95, 0.25);
        border-radius: 2px;
        padding: 1rem 1.1rem;
        margin-bottom: 1rem;
      }
      .conflict-box .summary {
        color: var(--red);
        font-weight: 500;
        font-size: 0.92rem;
      }

      details {
        font-size: 0.85rem;
        margin-top: 1rem;
      }
      summary {
        cursor: pointer;
        color: var(--dim);
        font-family: "IBM Plex Mono", monospace;
        font-size: 0.72rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        list-style: none;
      }
      summary::before {
        content: "▸ ";
        color: var(--accent);
      }
      details[open] summary::before {
        content: "▾ ";
      }
      summary:hover {
        color: var(--accent);
      }

      .loading {
        color: var(--dim);
        font-family: "IBM Plex Mono", monospace;
        font-size: 0.85rem;
      }
      .loading::after {
        content: "";
        animation: dots 1.4s steps(4, end) infinite;
      }
      @keyframes dots {
        0% {
          content: "";
        }
        25% {
          content: ".";
        }
        50% {
          content: "..";
        }
        75% {
          content: "...";
        }
      }

      footer {
        margin-top: 4rem;
        padding-top: 1.2rem;
        border-top: 1px solid var(--line);
        font-size: 0.8rem;
        color: var(--dimmer);
        line-height: 1.8;
      }
      a {
        color: var(--accent);
        text-decoration: none;
        border-bottom: 1px solid var(--line-bright);
      }
      a:hover {
        border-color: var(--accent);
      }

      .sub em,
      footer em {
        font-style: normal;
        color: var(--amber);
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <main id="root"></main>

    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.production.min.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"
    ></script>
    <script type="text/babel">
      const { useState, useEffect } = React;
      const e = React.createElement;

      const EXAMPLES = [
        "Wie viele Leistungspunkte umfasst ein Modul?",
        "How many times can I retake a failed exam?",
        "Wie hoch sind die Studiengebühren?",
      ];

      // Cycled through the placeholder, alternating language so it is obvious
      // the system answers in whichever language you ask in.
      const PLACEHOLDERS = [
        "Wie lange habe ich für die Masterarbeit?",
        "What happens if I fail an exam three times?",
        "Welche Prüfungsformen sind im Studiengang IAI zulässig?",
        "Which modules in International Business are ungraded?",
        "Wann gilt die Erste Änderungsordnung für mich?",
        "How many credit points do I need before the thesis?",
      ];

      const TYPE_MS = 45;
      const ERASE_MS = 22;
      const HOLD_MS = 2200;

      /** Types a phrase out, holds, erases, moves to the next. */
      function useTypedPlaceholder(phrases, paused) {
        const [text, setText] = useState("");
        const [i, setI] = useState(0);
        const [erasing, setErasing] = useState(false);

        useEffect(() => {
          if (paused) return;
          const full = phrases[i % phrases.length];

          if (!erasing && text === full) {
            const t = setTimeout(() => setErasing(true), HOLD_MS);
            return () => clearTimeout(t);
          }
          if (erasing && text === "") {
            setErasing(false);
            setI((n) => n + 1);
            return;
          }
          const t = setTimeout(
            () =>
              setText((cur) =>
                erasing ? cur.slice(0, -1) : full.slice(0, cur.length + 1),
              ),
            erasing ? ERASE_MS : TYPE_MS,
          );
          return () => clearTimeout(t);
        }, [text, i, erasing, paused, phrases]);

        return text;
      }

      function Verdict({ data }) {
        const route = [];
        if (data.apparent_conflict) route.push(["triage", "tension detected"]);
        // "none" means the discriminator found no override rule — not useful to show.
        if (data.override_rule && data.override_rule !== "none")
          route.push(["resolved", data.override_rule]);
        return e(
          "div",
          { className: "verdict" },
          e("span", { className: `tag ${data.decision}` }, data.decision),
          route.map(([k, v], i) =>
            e(
              "span",
              { className: "route mono", key: i },
              `${k} → `,
              e("span", null, v),
            ),
          ),
        );
      }

      function Citation({ c }) {
        return e(
          "div",
          { className: "src cited" },
          e("span", { className: "cite" }, `${c.document} · ${c.locus}`),
          c.quote ? e("blockquote", null, c.quote) : null,
        );
      }

      function Chunk({ n }) {
        return e(
          "div",
          { className: "src" },
          e(
            "span",
            { className: "cite" },
            `${n.document} · ${n.section ?? "—"}`,
          ),
          e(
            "span",
            { className: "meta mono" },
            `${n.chunk_type ?? ""}${n.score != null ? "  " + n.score.toFixed(3) : ""}`,
          ),
          e("p", null, n.text.slice(0, 260) + (n.text.length > 260 ? "…" : "")),
        );
      }

      function Result({ data }) {
        return e(
          "div",
          null,
          e(
            "div",
            { className: "panel" },
            e(Verdict, { data }),
            e("div", { className: "answer-text" }, data.answer),
          ),

          data.conflicts.length
            ? e(
                "div",
                null,
                e("h2", null, "Conflicting provisions"),
                data.conflicts.map((c, i) =>
                  e(
                    "div",
                    { className: "conflict-box", key: i },
                    e("div", { className: "summary" }, c.summary),
                    c.citations.map((ct, j) =>
                      e(
                        "div",
                        { key: j, style: { marginTop: "0.6rem" } },
                        e(
                          "span",
                          { className: "cite" },
                          `${ct.document} · ${ct.locus}`,
                        ),
                        ct.quote ? e("blockquote", null, ct.quote) : null,
                      ),
                    ),
                  ),
                ),
              )
            : null,

          data.citations.length
            ? e(
                "div",
                null,
                e("h2", null, "Citations"),
                data.citations.map((c, i) => e(Citation, { c, key: i })),
              )
            : null,

          data.retrieved.length
            ? e(
                "details",
                null,
                e(
                  "summary",
                  null,
                  `Retrieved passages · ${data.retrieved.length}`,
                ),
                e(
                  "div",
                  { style: { marginTop: "1rem" } },
                  data.retrieved.map((n, i) => e(Chunk, { n, key: i })),
                ),
              )
            : null,
        );
      }

      function App() {
        const [question, setQuestion] = useState("");
        const [data, setData] = useState(null);
        const [busy, setBusy] = useState(false);
        const [error, setError] = useState("");
        const [focused, setFocused] = useState(false);

        // Freeze the animation once the user engages — a moving placeholder
        // behind a half-typed question is just noise.
        const placeholder = useTypedPlaceholder(
          PLACEHOLDERS,
          focused || question.length > 0 || busy,
        );
        async function ask(ev) {
          ev.preventDefault();
          const q = question.trim();
          if (!q) return;
          setBusy(true);
          setData(null);
          setError("");
          try {
            const r = await fetch("/api/query", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ question: q }),
            });
            if (!r.ok) {
              const body = await r.json().catch(() => ({}));
              throw new Error(body.detail || `HTTP ${r.status}`);
            }
            setData(await r.json());
          } catch (err) {
            const msg = String(err.message || "");
            setError(
              msg.includes("429") || msg.includes("RESOURCE_EXHAUSTED")
                ? "API quota exceeded — the Gemini spending cap has been reached."
                : msg.includes("Connection") || msg.includes("refused")
                  ? "Cannot reach Qdrant. Is the container running?"
                  : "Request failed: " + msg.slice(0, 200),
            );
          } finally {
            setBusy(false);
          }
        }

        return e(
          React.Fragment,
          null,
          e(
            "header",
            null,
            e(
              "div",
              { className: "eyebrow mono" },
              "Synthetic corpus · Prüfungsordnungen · RAG",
            ),
            e("h1", null, "MyUniGuide ", e("b", null, "V2")),
            e(
              "p",
              { className: "sub" },
              "Questions about German university examination regulations, in German or " +
                "English. Answers cite the governing provision — or decline when there isn't one.",
            ),
            e(
              "div",
              { className: "notice" },
              e("b", null, "Not real regulations. "),
              "Velmora and Rheinmark are fictional universities, with documents built to " +
                "contain known conflicts and unanswerable questions. Student project — answers " +
                "are generated and can be wrong.",
            ),
          ),

          e(
            "form",
            { onSubmit: ask },
            e("input", {
              type: "text",
              maxLength: 300,
              autoComplete: "off",
              className: focused || question ? "" : "typing",
              placeholder: placeholder || " ",
              value: question,
              onFocus: () => setFocused(true),
              onBlur: () => setFocused(false),
              onChange: (ev) => setQuestion(ev.target.value),
            }),
            e("button", { type: "submit", disabled: busy }, busy ? "…" : "Ask"),
          ),

          e(
            "p",
            { className: "examples" },
            EXAMPLES.map((x, i) =>
              e(
                "button",
                { type: "button", key: i, onClick: () => setQuestion(x) },
                x,
              ),
            ),
          ),

          busy ? e("p", { className: "loading" }, "retrieving") : null,
          error ? e("div", { className: "notice" }, error) : null,
          data ? e(Result, { data }) : null,

          e(
            "footer",
            null,
            "19 synthetic documents · 395 chunks · two fictional universities, four " +
              "programmes, 108 modules.",
            e("br"),
            "Docling · hybrid dense + BM25 in Qdrant · LangGraph · schema-enforced output · Langfuse. ",
            e("a", { href: "/docs" }, "API docs"),
          ),
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(e(App));
    </script>
  </body>
</html>
