services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: myuniguide-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: myuniguide-app
    depends_on:
      qdrant:
        condition: service_healthy
    environment:
      QDRANT_URL: http://qdrant:6333
    env_file:
      - .env
    volumes:
      - ./corpus:/app/corpus:ro
      - ./eval/results:/app/eval/results
      - ./.cache:/app/.cache
    profiles: ["app"]
