  - code: IAI-M-19
    name: German as a Foreign Language A2
    semester: 2
    ects: 3
    sws: 4
    language: German
    frequency: Annually, summer semester
    duration: 1 semester
    type: Elective
    responsible: Language Centre, Dr. Ilka Wendehorst
    department: Language Centre
    exam: PF
    exam_note: Portfolio comprising at least three components
    prerequisites_formal: Successful completion of IAI-M-06 or evidence of German at level A1
    prerequisites_recommended: None
