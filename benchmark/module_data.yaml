    duration: 1 semester
    type: Elective
    responsible: Prof. Dr.-Ing. Anselm Bierbaum
    department: Faculty of Engineering and Computer Science
    exam: M20
    exam_note: Oral examination, approx. 20 minutes
    prerequisites_formal: Successful completion of IAI-M-07
    prerequisites_recommended: IAI-M-08
    special_note: Offered biennially. Next offering summer semester 2026.
    outcomes:
    - fuse data from heterogeneous sensors for robot state estimation
    - implement pose estimation for grasping tasks
    - assess perception reliability in collaborative robot settings
