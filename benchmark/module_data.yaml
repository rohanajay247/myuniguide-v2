    department: Department of Business Studies
    exam: Kl-120
    exam_note: Written examination, 120 minutes
    prerequisites_formal: None
    prerequisites_recommended: None
    outcomes:
    - describe the principal functions of a commercial enterprise and their interdependence
    - distinguish legal forms of enterprise and their consequences for liability and finance
    - apply basic decision models to operational business problems
    content:
    - The enterprise as an economic and legal unit
    - Legal forms and governance structures
    - 'Functional areas: procurement, production, marketing, finance'
    - Organisational structures and coordination mechanisms
    - 'Decision theory: objectives, alternatives, criteria'
    - Introduction to corporate governance and stakeholder analysis
