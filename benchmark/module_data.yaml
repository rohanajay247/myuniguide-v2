IAI:
  programme: IAI
  workload_per_credit: 30
  semester_plan:
    1:
      compulsory:
      - IAI-M-01
      - IAI-M-02
      - IAI-M-03
      - IAI-M-04
      - IAI-M-05
      - IAI-M-06
      elective_credits: 0
      total: 30
    2:
      compulsory:
      - IAI-M-07
      - IAI-M-08
      - IAI-M-09
      - IAI-M-10
      - IAI-M-11
      elective_credits: 3
      total: 30
    3:
      compulsory:
      - IAI-M-21
      elective_credits: 0
      total: 30
  elective_catalogue:
    required_credits: 3
    note: Students select one module from the elective catalogue in the second semester.
    members:
    - IAI-M-12
    - IAI-M-13
    - IAI-M-14
    - IAI-M-15
    - IAI-M-16
    - IAI-M-17
    - IAI-M-18
    - IAI-M-19
    - IAI-M-20
  variant_groups: null
  modules:
  - code: IAI-M-01
    name: Mathematical Foundations of Machine Learning
    semester: 1
    ects: 6
    sws: 4
    language: English
    frequency: Annually, winter semester
    duration: 1 semester
    type: Compulsory
    responsible: Prof. Dr. Helene Trautwein
    department: Faculty of Engineering and Computer Science
    exam: K120
    exam_note: Written examination, 120 minutes
    prerequisites_formal: None
    prerequisites_recommended: Undergraduate linear algebra and calculus
    outcomes:
    - reformulate applied problems in the language of linear algebra and multivariate calculus
    - derive gradients of composite functions and apply them to parameter estimation
    - assess the numerical stability of matrix decompositions used in learning algorithms
    - evaluate probabilistic models using the language of measure-theoretic probability at an applied
      level
    content:
    - Vector spaces, norms, inner products; orthogonal projection
    - Eigenvalue and singular value decomposition; low-rank approximation
    - Multivariate differentiation, Jacobians, Hessians; chain rule for computational graphs
    - Convexity, first- and second-order optimality conditions
    - Gradient descent, stochastic gradient descent, momentum methods; convergence behaviour
    - Probability spaces, random vectors, conditional expectation, maximum likelihood estimation
    - Matrix calculus for backpropagation
    methods: Lecture (2 SWS) with integrated exercise sessions (2 SWS); weekly problem sets discussed
      in class
    credit_requirements: Passing the written examination (K120). Credit points are awarded once the module
      examination has been passed.
    literature:
    - 'Deisenroth, Faisal, Ong: Mathematics for Machine Learning, Cambridge University Press'
    - 'Boyd, Vandenberghe: Convex Optimization, Cambridge University Press'
    - 'Strang: Linear Algebra and Learning from Data, Wellesley-Cambridge Press'
    usability: Compulsory module of the M.Sc. Industrial Artificial Intelligence. Provides the mathematical
      basis for IAI-M-03 and IAI-M-07.
  - code: IAI-M-02
    name: Industrial Data Engineering
    semester: 1
    ects: 6
    sws: 4
    language: English
    frequency: Annually, winter semester
    duration: 1 semester
    type: Compulsory
    responsible: Prof. Dr.-Ing. Kaspar Rehnitz
    department: Faculty of Engineering and Computer Science
    exam: PJ
    exam_note: Project work; documented data pipeline with written report
    exam_components:
    - name: Implemented pipeline and documentation
      weight: 70
    - name: Oral defence of design decisions (approx. 15 min)
      weight: 30
    prerequisites_formal: None
    prerequisites_recommended: Programming experience in Python; basic relational database knowledge
    outcomes:
    - design ingestion pipelines for high-frequency machine and process data
    - select appropriate storage models for time-series, event and relational industrial data
    - implement data quality checks and quantify their effect on downstream model performance
    - document data lineage in a form suitable for audit
    content:
    - 'Industrial data sources: PLC, SCADA, MES, ERP; OPC UA information models'
    - Time-series storage, downsampling, retention policies
    - Batch and streaming ingestion; message brokers
    - Schema evolution and data contracts
    - Data quality dimensions; drift detection at the ingestion layer
    - Data lineage, provenance and reproducibility
    - Practical work with a simulated production line data set
    methods: Lecture (2 SWS), laboratory exercise (2 SWS) in small groups on the faculty's data engineering
      testbed
    credit_requirements: Submission and acceptance of the project work including the oral defence. Both
      components must be passed independently.
    literature:
    - 'Kleppmann: Designing Data-Intensive Applications, O''Reilly'
    - 'Reis, Housley: Fundamentals of Data Engineering, O''Reilly'
    - 'OPC Foundation: OPC Unified Architecture specification parts 1–5'
    usability: Compulsory module of the M.Sc. Industrial Artificial Intelligence. Prerequisite for IAI-M-09.
  - code: IAI-M-03
    name: 'Machine Learning I: Supervised and Unsupervised Methods'
    semester: 1
    ects: 6
    sws: 4
    language: English
    frequency: Annually, winter semester
    duration: 1 semester
    type: Compulsory
    responsible: Prof. Dr. Helene Trautwein
    department: Faculty of Engineering and Computer Science
    exam: K120
    exam_note: Written examination, 120 minutes
    prerequisites_formal: None
    prerequisites_recommended: Parallel attendance of IAI-M-01
    outcomes:
    - select learning algorithms appropriate to a given industrial problem and data regime
    - design validation strategies that avoid optimistic bias under temporal correlation
    - interpret model behaviour using feature attribution methods
    - quantify and communicate model uncertainty to non-specialist stakeholders
    content:
    - Empirical risk minimisation; bias-variance decomposition
    - Linear and logistic regression; regularisation
    - Support vector machines and kernel methods
    - Decision trees, random forests, gradient boosting
    - Clustering, density estimation, dimensionality reduction
    - Cross-validation under temporal and group structure
    - 'Model interpretability: permutation importance, SHAP, partial dependence'
    methods: Lecture (3 SWS) with computer-based exercises (1 SWS)
    credit_requirements: Passing the written examination (K120).
    literature:
    - 'Hastie, Tibshirani, Friedman: The Elements of Statistical Learning, Springer'
    - 'Murphy: Probabilistic Machine Learning – An Introduction, MIT Press'
    - 'Molnar: Interpretable Machine Learning'
    usability: Compulsory module of the M.Sc. Industrial Artificial Intelligence. Prerequisite for IAI-M-07
      and IAI-M-08.
  - code: IAI-M-04
    name: Sensor Systems and Signal Processing
    semester: 1
    ects: 6
    sws: 4
    language: English
    frequency: Annually, winter semester
    duration: 1 semester
    type: Compulsory
    responsible: Prof. Dr.-Ing. Anselm Bierbaum
    department: Faculty of Engineering and Computer Science
    exam: K90
    exam_note: Written examination, 90 minutes
    prerequisites_formal: None
    prerequisites_recommended: Fundamentals of electrical engineering; Fourier analysis
    outcomes:
    - characterise industrial sensors by their transfer behaviour, noise and failure modes
    - design digital filters for the suppression of process-typical disturbances
    - apply time-frequency methods to non-stationary machine signals
    - justify sampling and quantisation decisions against a measurement requirement
    content:
    - 'Sensor principles: piezoelectric, inductive, optical, thermal'
    - 'Metrological characteristics: sensitivity, hysteresis, drift, calibration'
    - Sampling, aliasing, quantisation noise
    - FIR and IIR filter design
    - Spectral estimation; windowing; short-time Fourier transform
    - Wavelet analysis for transient detection
    - Condition indicators for rotating machinery
    methods: Lecture (3 SWS) and laboratory exercise (1 SWS) on the vibration analysis test rig
    credit_requirements: Passing the written examination (K90). Successful completion of the laboratory
      exercise is a prerequisite for admission to the examination.
    literature:
    - 'Oppenheim, Schafer: Discrete-Time Signal Processing, Pearson'
    - 'Randall: Vibration-based Condition Monitoring, Wiley'
    - 'Tränkler, Reindl: Sensortechnik, Springer Vieweg'
    usability: Compulsory module of the M.Sc. Industrial Artificial Intelligence. Prerequisite for IAI-M-13.
  - code: IAI-M-05
    name: Research Methods and Scientific Writing
    semester: 1
    ects: 3
    sws: 2
    language: English
    frequency: Annually, winter semester
    duration: 1 semester
    type: Compulsory
    responsible: Prof. Dr. Marit Sonnleitner
    department: Faculty of Engineering and Computer Science
    exam: RE
    exam_note: Presentation with written elaboration
    prerequisites_formal: None
    prerequisites_recommended: None
    outcomes:
    - formulate a research question that is answerable within the constraints of a master's thesis
    - conduct a structured literature search and appraise source quality
    - design an experimental protocol including controls and statistical power considerations
    - write in the register and structure expected of an engineering research report
    content:
    - Research designs in applied engineering; internal and external validity
    - Systematic literature search; bibliographic management
    - Statistical hypothesis testing, effect sizes, multiple comparison
    - Reproducibility, pre-registration, data availability
    - Academic integrity, citation practice, plagiarism
    - Structure and register of technical reports
    methods: Seminar (2 SWS) with peer review of drafts
    credit_requirements: Presentation of approximately 20 minutes and written elaboration of 8 to 12 pages.
      Both parts form a single examination performance and are assessed together.
    literature:
    - 'Booth, Colomb, Williams: The Craft of Research, University of Chicago Press'
    - 'Wohlin et al.: Experimentation in Software Engineering, Springer'
    usability: Compulsory module of the M.Sc. Industrial Artificial Intelligence. Prepares the master's
      thesis (IAI-M-21).
  - code: IAI-M-06
    name: German as a Foreign Language A1
    semester: 1
    ects: 3
    sws: 4
    language: German/English
    frequency: Annually, winter semester
    duration: 1 semester
    type: Compulsory
    responsible: Language Centre, Dr. Ilka Wendehorst
    department: Language Centre
    exam: PF
    exam_note: Portfolio comprising at least three components
    exam_components:
    - name: Written test
      weight: 40
    - name: Oral interaction task
      weight: 30
    - name: Learning diary
      weight: 30
    prerequisites_formal: None
    prerequisites_recommended: No prior knowledge of German required
    special_note: 'Unusual workload structure: 4 SWS contact time against 3 ECTS, reflecting the high
      contact-hour requirement of beginner language instruction.'
    outcomes:
    - understand and use familiar everyday expressions and very basic phrases
    - introduce themselves and others and ask and answer questions about personal details
    - interact in a simple way in the university and workplace context
    - read short workplace safety notices with dictionary support
    content:
    - Greetings, introductions, numbers, time
    - Present tense of regular and common irregular verbs
    - Nominative and accusative case; definite and indefinite articles
    - Everyday and university vocabulary; basic workplace vocabulary
    - Simple written correspondence
    methods: Language course (4 SWS) in groups of no more than 18 participants
    credit_requirements: Portfolio comprising the three components listed above; each component must be
      submitted, and the aggregate must be passed.
    literature:
    - Course materials provided by the Language Centre
    usability: Compulsory module of the M.Sc. Industrial Artificial Intelligence. Students who provide
      evidence of German language competence at level A2 or above of the Common European Framework may
      apply to the examination board for recognition under § 15 ASPO.
  - code: IAI-M-07
    name: Deep Learning for Industrial Applications
    semester: 2
    ects: 6
    sws: 4
    language: English
    frequency: Annually, summer semester
    duration: 1 semester
    type: Compulsory
    responsible: Prof. Dr. Helene Trautwein
    department: Faculty of Engineering and Computer Science
    exam: K120
    exam_note: Written examination, 120 minutes
    prerequisites_formal: Successful completion of IAI-M-03
    prerequisites_recommended: IAI-M-01
    outcomes:
    - design network architectures matched to the structure of industrial data
    - diagnose and remedy training pathologies
    - apply transfer learning where labelled industrial data are scarce
    - estimate the inference cost of a trained model against deployment constraints
    content:
    - Feedforward networks, backpropagation, initialisation
    - 'Regularisation: dropout, weight decay, early stopping, data augmentation'
    - Convolutional architectures; residual connections
    - 'Sequence models: recurrent networks, temporal convolutions, attention'
    - Transfer learning and fine-tuning under limited labelled data
    - 'Model compression: pruning, quantisation, distillation'
    - Training diagnostics and reproducibility
    methods: Lecture (2 SWS) and computer laboratory (2 SWS) on the faculty GPU cluster
    credit_requirements: Passing the written examination (K120).
    literature:
    - 'Goodfellow, Bengio, Courville: Deep Learning, MIT Press'
    - 'Zhang et al.: Dive into Deep Learning, Cambridge University Press'
    usability: Compulsory module of the M.Sc. Industrial Artificial Intelligence. Prerequisite for IAI-M-15
      and IAI-M-18.
  - code: IAI-M-08
    name: Industrial Computer Vision
    semester: 2
    ects: 6
    sws: 4
    language: English
    frequency: Annually, summer semester
    duration: 1 semester
    type: Compulsory
    responsible: Prof. Dr.-Ing. Anselm Bierbaum
    department: Faculty of Engineering and Computer Science
    exam: PJ
    exam_note: Project work
    prerequisites_formal: Successful completion of IAI-M-03
    prerequisites_recommended: None
    outcomes:
    - specify an industrial vision system including illumination and optics
    - implement classical and learning-based inspection pipelines
    - evaluate inspection performance against defect rates and cost of error
    - assess the limits of vision-based inspection in a given production context
    content:
    - Image formation, optics, illumination geometries
    - Camera calibration and photometric correction
    - Classical feature detection, segmentation, morphology
    - Learning-based detection and segmentation
    - Anomaly detection with few defect samples
    - Performance evaluation under class imbalance; cost-sensitive thresholds
    - Integration with production line control
    methods: Lecture (2 SWS) and project laboratory (2 SWS) at the vision inspection cell
    credit_requirements: Submission and acceptance of a working inspection pipeline with written report
      of 15 to 20 pages.
    literature:
    - 'Szeliski: Computer Vision – Algorithms and Applications, Springer'
    - 'Steger, Ulrich, Wiedemann: Machine Vision Algorithms and Applications, Wiley-VCH'
    usability: Compulsory module of the M.Sc. Industrial Artificial Intelligence.
  - code: IAI-M-09
    name: Cyber-Physical Production Systems
    semester: 2
    ects: 6
    sws: 4
    language: English
    frequency: Annually, summer semester
    duration: 1 semester
    type: Compulsory
    responsible: Prof. Dr.-Ing. Kaspar Rehnitz
    department: Faculty of Engineering and Computer Science
    exam: K90
    exam_note: Written examination, 90 minutes
    prerequisites_formal: Successful completion of IAI-M-02
    prerequisites_recommended: None
    outcomes:
    - describe the automation hierarchy and its dissolution in modern architectures
    - specify communication requirements for latency-critical control loops
    - assess the safety and security implications of networked production equipment
    - design the interface between an analytics component and a control system
    content:
    - Automation pyramid; edge, fog and cloud allocation
    - Fieldbus and industrial Ethernet; time-sensitive networking
    - Real-time constraints; determinism and jitter
    - Asset administration shells and digital representation
    - Functional safety in networked systems; IEC 61508 overview
    - 'Industrial security: segmentation, IEC 62443 overview'
    - 'Interfacing analytics with control: advisory versus closed-loop operation'
    methods: Lecture (3 SWS) and laboratory (1 SWS) on the model production line
    credit_requirements: Passing the written examination (K90).
    literature:
    - 'Vogel-Heuser, Bauernhansl, ten Hompel (eds.): Handbuch Industrie 4.0, Springer Vieweg'
    - 'Sauter et al.: Industrial Communication Technology Handbook, CRC Press'
    usability: Compulsory module of the M.Sc. Industrial Artificial Intelligence.
  - code: IAI-M-10
    name: Master Project Industrial AI
    semester: 2
    ects: 6
    sws: 2
    language: English
    frequency: Annually, summer semester
    duration: 1 semester
    type: Compulsory
    responsible: Programme director, Prof. Dr. Helene Trautwein
    department: Faculty of Engineering and Computer Science
    exam: PJ
    exam_note: Project work, carried out in teams of three to five students
    special_note: Deviating from § 20 Abs. 1 ASPO, this module may be repeated only once (§ 9 Abs. 1 BSPO
      IAI).
    prerequisites_formal: Successful completion of at least 24 ECTS credits from the first semester of
      the programme
    prerequisites_recommended: IAI-M-02, IAI-M-03
    outcomes:
    - plan and execute an applied AI project against an externally supplied requirement
    - allocate work within a team and manage technical dependencies
    - produce a solution that is deployable in the client's technical environment
    - present results to a mixed technical and managerial audience
    content:
    - Project definition in cooperation with an industrial partner or research group
    - Requirements elicitation and scoping
    - Iterative development with milestone reviews
    - Technical documentation and handover
    - Final presentation to the client
    methods: Project work (2 SWS supervision) with three scheduled milestone reviews
    credit_requirements: Acceptance of the team project report and the final presentation. Individual
      contributions must be separately identifiable and are assessed individually.
    literature:
    - Project-specific; determined at project definition
    usability: Compulsory module of the M.Sc. Industrial Artificial Intelligence.
  - code: IAI-M-11
    name: Ethics, Law and Safety of AI Systems
    semester: 2
    ects: 3
    sws: 2
    language: English
    frequency: Annually, summer semester
    duration: 1 semester
    type: Compulsory
    responsible: Prof. Dr. Marit Sonnleitner
    department: Faculty of Engineering and Computer Science
    exam: RE
    exam_note: Presentation with written elaboration
    prerequisites_formal: None
    prerequisites_recommended: None
    outcomes:
    - identify the regulatory regime applicable to an AI system in an industrial setting
    - conduct a structured risk assessment for a deployed model
    - articulate the ethical trade-offs in automation decisions affecting workers
    - document conformity considerations for a high-risk application
    content:
    - European regulatory framework for artificial intelligence; risk classes
    - Product safety and machinery regulation; interaction with AI components
    - Data protection in industrial contexts; works council participation
    - Fairness, accountability and transparency in employment-adjacent systems
    - Liability allocation for autonomous decisions
    - Case studies from manufacturing and logistics
    methods: Seminar (2 SWS) with case discussion
    credit_requirements: Presentation of approximately 20 minutes and written elaboration of 8 to 12 pages.
    literature:
    - 'Wachter, Mittelstadt, Floridi: Transparent, Explainable and Accountable AI'
    - Current consolidated texts of the applicable European regulations
    usability: Compulsory module of the M.Sc. Industrial Artificial Intelligence.
  - code: IAI-M-12
    name: Reinforcement Learning for Process Control
    semester: 2
    ects: 3
    sws: 2
    language: English
    frequency: Annually, summer semester
    duration: 1 semester
    type: Elective
    responsible: Prof. Dr. Helene Trautwein
    department: Faculty of Engineering and Computer Science
    exam: M20
    exam_note: Oral examination, approx. 20 minutes
    prerequisites_formal: None
    prerequisites_recommended: IAI-M-03
    outcomes:
    - formulate a control problem as a Markov decision process
    - select between value-based and policy-based methods for a given problem
    - assess the sample efficiency and safety implications of learning in a physical plant
    content:
    - Markov decision processes; dynamic programming
    - Temporal difference learning; Q-learning
    - Policy gradient methods; actor-critic
    - Offline reinforcement learning from logged process data
    - Safe exploration and constrained policies
    methods: Lecture with integrated exercises (2 SWS)
    credit_requirements: Passing the oral examination (M20).
    literature:
    - 'Sutton, Barto: Reinforcement Learning – An Introduction, MIT Press'
    usability: Elective module of the M.Sc. Industrial Artificial Intelligence, elective catalogue under
      Annex 2 of the Special Regulations.
  - code: IAI-M-13
    name: Time Series Analysis and Predictive Maintenance
    semester: 2
    ects: 3
    sws: 2
    language: English
    frequency: Annually, summer semester
    duration: 1 semester
    type: Elective
    responsible: Prof. Dr.-Ing. Anselm Bierbaum
    department: Faculty of Engineering and Computer Science
    exam: PJ
    exam_note: Project work
    prerequisites_formal: Successful completion of IAI-M-04
    prerequisites_recommended: IAI-M-03
    outcomes:
    - model degradation processes from condition monitoring data
    - estimate remaining useful life with calibrated uncertainty
    - design a maintenance policy that balances intervention and failure cost
    content:
    - Stationarity, autocorrelation, spectral representation
    - ARIMA and state space models
    - Survival analysis and degradation modelling
    - Remaining useful life estimation; prognostic metrics
    - Maintenance policy optimisation
    methods: Lecture (1 SWS) and computer laboratory (1 SWS)
    credit_requirements: Submission and acceptance of the project work.
    literature:
    - 'Hyndman, Athanasopoulos: Forecasting – Principles and Practice'
    - 'Si et al.: Remaining Useful Life Estimation – A Review'
    usability: Elective module of the M.Sc. Industrial Artificial Intelligence.
  - code: IAI-M-14
    name: Natural Language Processing in Engineering Contexts
    semester: 2
    ects: 3
    sws: 2
    language: English
    frequency: Annually, summer semester
    duration: 1 semester
    type: Elective
    responsible: Prof. Dr. Marit Sonnleitner
    department: Faculty of Engineering and Computer Science
    exam: PJ
    exam_note: Project work
    prerequisites_formal: None
    prerequisites_recommended: IAI-M-03
    outcomes:
    - process unstructured maintenance and quality records
    - build retrieval systems over technical documentation
    - assess the reliability of language models in safety-relevant documentation tasks
    content:
    - Text preprocessing for technical German and English
    - 'Representation: embeddings, contextual models'
    - Information extraction from maintenance logs
    - Retrieval over technical documentation
    - Evaluation and failure modes in specialist domains
    methods: Lecture (1 SWS) and computer laboratory (1 SWS)
    credit_requirements: Submission and acceptance of the project work.
    literature:
    - 'Jurafsky, Martin: Speech and Language Processing'
    usability: Elective module of the M.Sc. Industrial Artificial Intelligence.
  - code: IAI-M-15
    name: Edge AI and Embedded Inference
    semester: 2
    ects: 3
    sws: 2
    language: English
    frequency: Annually, summer semester
    duration: 1 semester
    type: Elective
    responsible: Prof. Dr.-Ing. Kaspar Rehnitz
    department: Faculty of Engineering and Computer Science
    exam: LB
    exam_note: Laboratory work with certificate; ungraded
    ungraded: true
    prerequisites_formal: Successful completion of IAI-M-07
    prerequisites_recommended: None
    special_note: This module is assessed as an ungraded Studienleistung and does not contribute to the
      overall grade (§ 11 Abs. 3 BSPO IAI).
    outcomes:
    - deploy a trained model to a resource-constrained embedded target
    - measure and optimise inference latency and energy consumption
    - select quantisation strategies appropriate to an accuracy budget
    content:
    - Embedded accelerator architectures
    - Quantisation-aware training and post-training quantisation
    - Runtime environments for embedded inference
    - Latency and energy measurement methodology
    - Over-the-air model update strategies
    methods: Laboratory course (2 SWS) on embedded evaluation boards
    credit_requirements: Successful completion of all five laboratory assignments. The module is assessed
      as passed or not passed.
    literature:
    - 'Warden, Situnayake: TinyML, O''Reilly'
    usability: Elective module of the M.Sc. Industrial Artificial Intelligence.
  - code: IAI-M-16
    name: Digital Twins and Simulation
    semester: 2
    ects: 3
    sws: 2
    language: English
    frequency: Annually, summer semester
    duration: 1 semester
    type: Elective
    responsible: Prof. Dr.-Ing. Kaspar Rehnitz
    department: Faculty of Engineering and Computer Science
    exam: RE
    exam_note: Presentation with written elaboration
    prerequisites_formal: None
    prerequisites_recommended: IAI-M-09
    outcomes:
    - distinguish digital model, digital shadow and digital twin
    - couple a simulation model to live process data
    - validate a simulation against measured plant behaviour
    content:
    - 'Simulation paradigms: discrete event, continuous, hybrid'
    - Model calibration and validation
    - Co-simulation and interface standards
    - Synchronisation of twin and physical asset
    - Use of twins for what-if analysis and training data generation
    methods: Lecture (1 SWS) with simulation exercises (1 SWS)
    credit_requirements: Presentation of approximately 20 minutes and written elaboration of 8 to 12 pages.
    literature:
    - 'Law: Simulation Modeling and Analysis, McGraw-Hill'
    usability: Elective module of the M.Sc. Industrial Artificial Intelligence.
  - code: IAI-M-17
    name: MLOps and Model Lifecycle Management
    semester: 2
    ects: 3
    sws: 2
    language: English
    frequency: Annually, summer semester
    duration: 1 semester
    type: Elective
    responsible: Prof. Dr.-Ing. Kaspar Rehnitz
    department: Faculty of Engineering and Computer Science
