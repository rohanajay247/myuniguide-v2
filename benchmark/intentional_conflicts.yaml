version_dependent_cases:
- id: VD-01
  description: § 12 Abs. 2 Nr. 3 ASPO bezeichnet in der Fassung 1.0 die mündliche Prüfung, ab der Ersten
    Änderungssatzung die Projektarbeit. § 8 Abs. 1 BSPO Elektrotechnik verweist auf diese Nummer für das
    Modul ET-M-24.
  affected_module: ET-M-24
  answer_by_state:
    A: mündliche Prüfung
    A0: mündliche Prüfung
    B: Projektarbeit
    B0: Projektarbeit
  expected_response: ANSWER
  not_a_conflict_because: Es widersprechen sich keine gleichzeitig geltenden Normen; die Verweisung löst
    sich je nach maßgeblicher Fassung unterschiedlich auf.
- id: VD-02
  description: § 27 Abs. 3 ASPO betrifft in der Fassung 1.0 die Anwesenheitspflicht in Laborübungen; nach
    der Ersten Änderungssatzung bezeichnet dieselbe Zitierung die Teilnahme an Exkursionen (bisheriger
    Absatz 4).
  expected_response: ANSWER
- id: VD-03
  description: § 18 Abs. 3 ASPO betrifft bis zur Zweiten Änderungssatzung die zweiwöchige Einsichtnahmefrist,
    danach die fünfjährige Aufbewahrungsfrist (bisheriger Absatz 4).
  expected_response: ANSWER
- id: VD-04
  description: § 22 Abs. 4 APO betrifft in der Fassung 1.0 die Hochschulöffentlichkeit des Kolloquiums,
    nach der Ersten Änderungsordnung die Wiederholbarkeit (bisheriger Absatz 5).
  expected_response: ANSWER
absence_cases:
- id: A-01
  question_topic: Zulässigkeit der Prüfungsform Hausarbeit an der Hochschule Velmora im WS 2025/26
  expected_response: ANSWER
  correct_answer: Nein. Die Hausarbeit ist seit der Zweiten Änderungssatzung nicht mehr im Katalog der
    Anlage 1 enthalten, und der Katalog ist abschließend.
  basis:
    doc: V1
    via: V3
    locus: Anlage 1 in der Fassung der Zweiten Änderungssatzung
  type: closed_enumeration
  note: Das Modulhandbuch IAI nennt für IAI-M-20 gleichwohl HA. Das Modulhandbuch ist nach § 9 Abs. 4
    ASPO nicht maßgeblich.
- id: A-02
  question_topic: Mündliche Gesamtprüfung im Masterstudiengang Industrial Artificial Intelligence
  expected_response: ANSWER
  correct_answer: Nein, eine mündliche Gesamtprüfung ist nicht vorgesehen. Die Masterprüfung besteht aus
    den Modulprüfungen und der Masterarbeit.
  basis:
    doc: V5
    locus: § 6 Abs. 1, § 13
  type: closed_enumeration
- id: A-03
  question_topic: Anrechnung des Moduls IB-5-029 auf den Wahlpflichtbereich
  expected_response: ANSWER
  correct_answer: Nein. IB-5-029 ist Zusatzmodul und ausdrücklich nicht Bestandteil des Wahlpflichtkatalogs
    nach Anlage 2.
  basis:
    doc: R7
    locus: § 12 Abs. 2, § 13 Abs. 2
  type: closed_enumeration
- id: A-04
  question_topic: Zulässigkeit der Prüfungsform Hausarbeit an der Hochschule Rheinmark
  expected_response: ANSWER
  correct_answer: Ja. HA ist in Anlage 2 APO aufgeführt; die Aufzählung ist zudem ausdrücklich nicht abschließend.
  basis:
    doc: R1
    locus: Anlage 2
  type: open_enumeration
  note: Existiert, um die Übergeneralisierung der abschließenden Velmora-Regel auf Rheinmark zu bestrafen.
- id: A-05
  question_topic: Nachträgliche Unterstellungserklärung eines SE-Studierenden der Kohorte WS 2022/23 im
