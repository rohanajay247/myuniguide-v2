classification_scheme:
  CONFLICT: Zwei ranggleiche, gleichzeitig geltende, bindende Quellen widersprechen sich; keine Vorrangregel
    löst den Widerspruch auf.
  OVERRIDE: Eine speziellere Norm weicht von einer allgemeinen ab; die Abweichung ist ausdrücklich gestattet.
    Kein Konflikt.
  VERSION_DEPENDENT: Dieselbe Zitierung bezeichnet je nach maßgeblicher Fassung unterschiedliche Inhalte.
    Kein Konflikt.
  AUTHORITY: Zwei Quellen weichen ab, aber eine ist nicht bindend oder nachrangig. Kein Konflikt.
  NEAR_DUPLICATE: Ähnlich formulierte Vorschriften mit unterschiedlichem Anwendungsbereich. Kein Widerspruch.
  ABSENCE: Die Dokumente stellen positiv fest, dass etwas nicht gilt bzw. nicht vorgesehen ist.
  NOT_COVERED: Die Dokumente enthalten keine Aussage; die Frage ist nicht beantwortbar.
conflicts:
- id: K-01
  university: HRM
  programme: IB
  type: binding body vs its own binding annex
  source_a:
    doc: R7
    locus: § 14 Abs. 2
    claim: Zulassung zur Bachelorarbeit ab 120 Leistungspunkten
  source_b:
    doc: R8
    locus: Anlage 1, Fußnote 4
    claim: Zulassung zur Bachelorarbeit ab 150 Leistungspunkten
  authority_a: BINDING_PROGRAMME
  authority_b: BINDING_ANNEX
  rationale: Anlage 1 ist nach § 6 Abs. 1 dieser Bestimmungen Bestandteil der Fachspezifischen Bestimmungen
    und damit ranggleich mit deren Wortlaut. Beide Fassungen wurden am selben Tag beschlossen und genehmigt.
    Weder die APO noch die FSB enthalten eine Regel, wonach der Wortlaut der Bestimmungen ihren Anlagen
    vorgeht oder umgekehrt. Eine Auflösung nach lex posterior scheidet aus, weil beide gleichzeitig in
    Kraft traten; lex specialis führt nicht weiter, weil beide Vorschriften denselben Gegenstand mit gleicher
    Regelungsdichte behandeln.
  affects: alle Studierenden des Studiengangs IB, in allen APO-Zuständen
  expected_response: CONFLICT
  not_resolvable_by:
  - lex posterior
  - lex specialis
  - Rangfolge
- id: K-02
  university: HVM
  programme: ET
  type: express non-deviation clause vs lex specialis
  source_a:
    doc: V1
    via: V2
    locus: § 31 Abs. 1 in der Fassung der Ersten Änderungssatzung
    claim: Bearbeitungszeit der Bachelorarbeit vier Monate; Abweichungen sind nicht zulässig
  source_b:
    doc: V8
    locus: § 12 Abs. 2
    claim: Bearbeitungszeit der Bachelorarbeit drei Monate
  authority_a: BINDING_GENERAL
  authority_b: BINDING_PROGRAMME
  rationale: § 31 Abs. 1 Satz 2 ASPO in der Fassung der Ersten Änderungssatzung schließt Abweichungen
    ausdrücklich aus und verdrängt damit die allgemeine Abweichungsbefugnis des § 3 Abs. 3 ASPO. § 12
    Abs. 2 BSPO Elektrotechnik stammt aus dem Jahr 2019, ist speziell und wurde nicht aufgehoben. Lex
    superior mit ausdrücklicher Abweichungssperre und lex specialis stehen sich gegenüber; keine der beiden
    Regeln setzt sich nach dem Text der Ordnungen durch.
  affects: ET-Studierende in den ASPO-Zuständen B und B0 (Erste Änderungssatzung anwendbar). In den Zuständen
    A und A0 besteht kein Widerspruch, weil § 31 Abs. 1 ASPO dort drei Monate vorsieht.
  expected_response: CONFLICT
  version_gated: true
  not_resolvable_by:
  - lex specialis
  - lex superior
- id: K-03
  university: HRM
  programme: SE
  type: two binding sources, no precedence rule
  source_a:
    doc: R5
    locus: Anlage 1, Zeile SE-3-018
    claim: Prüfungsform Kl-120
  source_b:
    doc: R6
    locus: Modulbeschreibung SE-3-018, Feld Prüfungsform
    claim: Prüfungsform PA
  authority_a: BINDING_ANNEX
  authority_b: PARTIALLY_BINDING
  rationale: § 9 Abs. 3 APO erklärt das Modulhandbuch hinsichtlich des Feldes „Prüfungsform“ ausdrücklich
    für verbindlich. Der Studien- und Prüfungsplan ist als Anlage 1 der Fachspezifischen Bestimmungen
    ebenfalls bindend. Beide Quellen sind damit für denselben Gegenstand bindend. Die APO enthält keine
    Vorrangregel zwischen dem Studien- und Prüfungsplan und dem Modulhandbuch für die Felder, in denen
    beide binden. § 9 Abs. 4 APO regelt nur den zeitlichen Wirksamwerdenszeitpunkt von Änderungen, nicht
    den Rang.
  affects: alle Studierenden des Studiengangs SE, in allen APO-Zuständen
  expected_response: CONFLICT
  not_resolvable_by:
  - Rangfolge
  - lex specialis
- id: K-04
  university: HVM
  programme: IAI
  type: prohibitive general rule created by amendment vs mandatory programme rule
  source_a:
    doc: V1
    via: V3
    locus: § 33 Abs. 3 Satz 2 in der Fassung der Zweiten Änderungssatzung
    claim: In Masterstudiengängen mit weniger als 120 ECTS-Punkten findet ein Kolloquium nicht statt
  source_b:
    doc: V5
    locus: § 13 Abs. 4
    claim: Die Masterarbeit wird durch ein Kolloquium von etwa 30 Minuten abgeschlossen
  authority_a: BINDING_GENERAL
  authority_b: BINDING_PROGRAMME
  rationale: Die durch die Zweite Änderungssatzung eingefügte Vorschrift ist prohibitiv formuliert („findet
    nicht statt“) und nicht lediglich freistellend. § 33 ASPO enthält keine Befugnis zur Abweichung durch
    Besondere Studien- und Prüfungsordnungen, so dass § 3 Abs. 3 ASPO nicht greift. § 13 Abs. 4 BSPO IAI
    stammt aus dem Jahr 2022 und ordnet das Kolloquium zwingend an. Der Studiengang umfasst 90 ECTS-Punkte
    und fällt damit in den Anwendungsbereich der Verbotsnorm.
  affects: IAI-Studierende im ASPO-Zustand B. In den Zuständen A0 und B0 (Zweite Änderungssatzung nicht
    anwendbar) besteht kein Widerspruch.
  expected_response: CONFLICT
  version_gated: true
  not_resolvable_by:
  - lex specialis
  - lex posterior
authority_cases:
- id: T-01
  type: AUTHORITY
  university: HVM
  programme: IAI
  description: Abweichung zwischen der deutschen und der englischen Fassung des § 9 Abs. 2 BSPO IAI. Die
    deutsche Fassung macht die zweite Wiederholung von einem stattgegebenen Antrag abhängig; die englische
    Fassung legt einen Anspruch nahe.
  resolution: § 1 Abs. 4 BSPO IAI bestimmt, dass ausschließlich die deutsche Fassung maßgeblich ist. Die
    englische Fassung ist eine nichtamtliche Übersetzung und begründet keine Rechte.
  expected_response: ANSWER
  correct_answer: Die zweite Wiederholung setzt einen Antrag voraus, dem der Prüfungsausschuss stattgegeben
    hat.
  not_a_conflict_because: Die beiden Fassungen sind nicht ranggleich.
- id: T-02
  type: AUTHORITY
  university: HVM
  programme: ET
  description: Das Modulhandbuch Elektrotechnik nennt für ET-M-20 abweichend vom Studien- und Prüfungsplan
    als Literaturangabe zusätzliche Werke und beschreibt die Zulassungsvoraussetzung ungenauer als § 9
    Abs. 1 BSPO ET.
  resolution: '§ 9 Abs. 4 ASPO: das Modulhandbuch begründet keine Rechte und Pflichten; maßgeblich sind
    ASPO, BSPO und Studien- und Prüfungsplan.'
  expected_response: ANSWER
  not_a_conflict_because: Das Velmora-Modulhandbuch ist rein beschreibend.
- id: T-03
  type: AUTHORITY
  university: HRM
  programme: SE
  description: Das Modulhandbuch Systems Engineering nennt für SE-2-006 Literaturangaben und Lehrende,
    die von anderen Quellen abweichen.
  resolution: § 9 Abs. 3 APO erklärt nur die Felder Modulinhalte, Prüfungsform und Voraussetzungen für
    die Vergabe von Leistungspunkten für verbindlich. Literatur und Lehrende sind beschreibend.
  expected_response: ANSWER
  not_a_conflict_because: Die abweichenden Felder gehören nicht zum bindenden Teil des Modulhandbuchs.
