resolution_procedure: 'resolve(family, cohort_start, query_date, facts): collect amendments whose in_force
  <= query_date; evaluate each amendment''s transitional predicate INDEPENDENTLY (not as a chain); the
  applicable version is the base plus the subset of amendments whose predicate holds.'
